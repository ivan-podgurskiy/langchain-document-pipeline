version: "3.9"

services:
  postgres:
    # PG 17.0 (Sep 2024) + pgvector 0.8.0 (Oct 2024)
    # PG 17 brings improved VACUUM performance and logical replication enhancements
    image: pgvector/pgvector:0.8.0-pg17
    container_name: langchain_pipeline_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documents"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
